<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EndoRisk — 404</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#6c63ff;--cyan:#00d4ff;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace}
body{font-family:var(--font);background:#04040a;color:#e8e6f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.num{font-size:clamp(80px,20vw,180px);font-weight:800;letter-spacing:-0.06em;line-height:1;background:linear-gradient(135deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
h1{font-size:24px;font-weight:800;margin-bottom:1rem;letter-spacing:-0.02em}
p{font-size:14px;color:#9896b0;margin-bottom:2rem;font-family:var(--mono)}
a{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4a43cc);color:#fff;text-decoration:none;transition:all 0.2s}
a:hover{box-shadow:0 0 30px rgba(108,99,255,0.5);transform:translateY(-1px)}
</style>
</head>
<body>
<div>
  <div class="num">404</div>
  <h1>Biomarker not found</h1>
  <p>This page doesn't exist in our clinical database.</p>
  <a href="index.html">← Return to EndoRisk</a>
</div>
</body>
</html>
